<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi bébé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: Arial, sans-serif;
      background: #fff7f9;
      color: #333;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    .boite {
      width: 100%;
      max-width: 500px;
      background: white;
      border-radius: 20px;
      padding: 30px 22px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
      font-size: 30px;
    }

    p {
      font-size: 17px;
      line-height: 1.5;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      font-size: 16px;
      cursor: pointer;
      background: #e889a5;
      color: white;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      font-weight: bold;
    }

    .erreur {
      color: #c62828;
      word-break: break-word;
    }

    #zoneApresConnexion {
      display: none;
    }

    #imageProtegee {
      display: none;
      width: 100%;
      max-width: 450px;
      margin-top: 20px;
      border-radius: 15px;
    }

    .boutons-localisation {
      display: flex;
      gap: 10px;
    }

    .boutons-localisation button {
      flex: 1;
    }
  </style>
</head>

<body>

  <div class="boite">

    <div id="zoneConnexion">

      <h1>Pour toi bébé</h1>

      <p>
        Entre ton adresse mail pour continuer.
      </p>

      <input
        id="email"
        type="email"
        placeholder="Ton adresse e-mail"
        autocomplete="email"
      >

      <button id="envoyer">
        Recevoir le lien
      </button>

      <div id="message" class="message"></div>

    </div>


    <div id="zoneApresConnexion">

      <h1>Bienvenue</h1>

      <p>
        Tu peux maintenant choisir de partager ta localisation.
        C'est facultatif.
      </p>

      <div class="boutons-localisation">

        <button id="autoriser">
          Autoriser
        </button>

        <button id="refuser">
          Refuser
        </button>

      </div>

      <p id="messageLocalisation" class="message"></p>

      <img
        id="imageProtegee"
        src=""
        alt="Image"
      >

    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyBdhh9FeXyjqDBH_q0CMP-d4xrILZXH_O8",
      authDomain: "pour-toi-bb.firebaseapp.com",
      projectId: "pour-toi-bb",
      storageBucket: "pour-toi-bb.firebasestorage.app",
      messagingSenderId: "922098615015",
      appId: "1:922098615015:web:f022dce2b3bb971b071842"
    };

    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    const siteUrl =
      "https://mathisraffalli2b-coder.github.io/pour-toi-bb/";


    const actionCodeSettings = {
      url: siteUrl,
      handleCodeInApp: true
    };


    const zoneConnexion =
      document.getElementById("zoneConnexion");

    const zoneApresConnexion =
      document.getElementById("zoneApresConnexion");

    const emailInput =
      document.getElementById("email");

    const envoyer =
      document.getElementById("envoyer");

    const message =
      document.getElementById("message");

    const autoriser =
      document.getElementById("autoriser");

    const refuser =
      document.getElementById("refuser");

    const messageLocalisation =
      document.getElementById("messageLocalisation");

    const imageProtegee =
      document.getElementById("imageProtegee");


    function afficherErreur(texte) {
      message.className = "message erreur";
      message.textContent = texte;
    }


    envoyer.addEventListener("click", async function () {

      const email = emailInput.value.trim();

      message.className = "message";
      message.textContent = "";

      if (!email) {
        message.textContent =
          "Entre ton adresse e-mail.";
        return;
      }

      envoyer.disabled = true;
      envoyer.textContent = "Envoi...";

      try {

        await auth.sendSignInLinkToEmail(
          email,
          actionCodeSettings
        );

        localStorage.setItem(
          "emailForSignIn",
          email
        );

        message.className = "message";

        message.textContent =
          "Le lien a été envoyé. Vérifie ta boîte mail.";

      } catch (error) {

        console.error(error);

        afficherErreur(
          "Erreur Firebase : " +
          error.code +
          " — " +
          error.message
        );

      } finally {

        envoyer.disabled = false;
        envoyer.textContent =
          "Recevoir le lien";

      }

    });


    async function traiterLienConnexion() {

      if (!auth.isSignInWithEmailLink(window.location.href)) {
        return;
      }

      let email =
        localStorage.getItem("emailForSignIn");

      if (!email) {

        email = window.prompt(
          "Entre l'adresse e-mail à laquelle tu as reçu le lien :"
        );

      }

      if (!email) {
        return;
      }

      try {

        await auth.signInWithEmailLink(
          email,
          window.location.href
        );

        localStorage.removeItem(
          "emailForSignIn"
        );

        afficherPageApresConnexion();

      } catch (error) {

        console.error(error);

        zoneConnexion.style.display =
          "block";

        message.className =
          "message erreur";

        message.textContent =
          "Impossible de confirmer le lien : " +
          error.code +
          " — " +
          error.message;

      }

    }


    function afficherPageApresConnexion() {

      zoneConnexion.style.display =
        "none";

      zoneApresConnexion.style.display =
        "block";

    }


    auth.onAuthStateChanged(function(user) {

      if (user) {
        afficherPageApresConnexion();
      }

    });


    autoriser.addEventListener(
      "click",
      function() {

        if (!navigator.geolocation) {

          messageLocalisation.textContent =
            "La localisation n'est pas disponible.";

          afficherImage();

          return;
        }

        navigator.geolocation.getCurrentPosition(

          function(position) {

            console.log(
              "Localisation autorisée :",
              position.coords.latitude,
              position.coords.longitude
            );

            messageLocalisation.textContent =
              "Merci. Ta localisation a été autorisée.";

            afficherImage();

          },

          function() {

            messageLocalisation.textContent =
              "La localisation n'a pas été autorisée.";

            afficherImage();

          }

        );

      }
    );


    refuser.addEventListener(
      "click",
      function() {

        messageLocalisation.textContent =
          "D'accord, aucune localisation n'est utilisée.";

        afficherImage();

      }
    );


    function afficherImage() {

      /*
        L'image sera ajoutée ici plus tard.
        Pour l'instant, l'emplacement reste vide.
      */

      imageProtegee.style.display =
        "none";

    }


    traiterLienConnexion();

  </script>

</body>
</html>
