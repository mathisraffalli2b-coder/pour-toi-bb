<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi bébé</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #fff;
    }

    h1 {
      margin-bottom: 30px;
    }

    input {
      width: 90%;
      max-width: 350px;
      padding: 12px;
      font-size: 16px;
      margin-bottom: 15px;
    }

    button {
      padding: 12px 20px;
      font-size: 16px;
      cursor: pointer;
      margin: 5px;
    }

    #contenu,
    #localisation {
      display: none;
    }

    #message {
      margin-top: 20px;
    }

    img {
      max-width: 100%;
      height: auto;
      margin-top: 20px;
    }
  </style>
</head>

<body>

  <h1>Pour toi bébé</h1>

  <div id="connexion">
    <p>Entre ton adresse mail pour continuer</p>

    <input
      type="email"
      id="email"
      placeholder="Ton adresse mail"
      required
    >

    <br>

    <button id="envoyer">Recevoir le lien</button>

    <p id="message"></p>
  </div>

  <div id="contenu">
    <h2>Bienvenue</h2>

    <p>Tu peux maintenant choisir de partager ta localisation, c'est facultatif.</p>

    <div id="localisation">
      <button id="autoriser">Autoriser</button>
      <button id="refuser">Refuser</button>
    </div>

    <div id="image">
      <p>Ton image apparaîtra ici.</p>
    </div>
  </div>

  <script type="module">
    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.19.0/firebase-app.js";

    import {
      getAuth,
      sendSignInLinkToEmail,
      isSignInWithEmailLink,
      signInWithEmailLink
    } from "https://www.gstatic.com/firebasejs/12.19.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBdhh9FeXyjqDBH_q0CMP-d4xrILZXH_O8",
      authDomain: "pour-toi-bb.firebaseapp.com",
      projectId: "pour-toi-bb",
      storageBucket: "pour-toi-bb.firebasestorage.app",
      messagingSenderId: "922098615015",
      appId: "1:922098615015:web:f022dce2b3bb971b071842"
    };

    const app = initializeApp(firebaseConfig);
    const auth = getAuth(app);

    const emailInput = document.getElementById("email");
    const envoyer = document.getElementById("envoyer");
    const message = document.getElementById("message");

    const connexion = document.getElementById("connexion");
    const contenu = document.getElementById("contenu");
    const localisation = document.getElementById("localisation");

    const autoriser = document.getElementById("autoriser");
    const refuser = document.getElementById("refuser");

    const actionCodeSettings = {
      url: window.location.href,
      handleCodeInApp: true
    };

    envoyer.addEventListener("click", async () => {
      const email = emailInput.value.trim();

      if (!email) {
        message.textContent = "Entre ton adresse mail.";
        return;
      }

      try {
        await sendSignInLinkToEmail(auth, email, actionCodeSettings);

        localStorage.setItem("emailForSignIn", email);

        message.textContent =
          "Le lien de connexion a été envoyé. Vérifie ta boîte mail.";
      } catch (error) {
        console.error(error);
        message.textContent =
          "Une erreur est survenue. Vérifie l'adresse mail.";
      }
    });

    if (isSignInWithEmailLink(auth, window.location.href)) {
      const email = localStorage.getItem("emailForSignIn");

      if (email) {
        try {
          await signInWithEmailLink(
            auth,
            email,
            window.location.href
          );

          localStorage.removeItem("emailForSignIn");

          connexion.style.display = "none";
          contenu.style.display = "block";
          localisation.style.display = "block";
        } catch (error) {
          console.error(error);
          message.textContent =
            "Le lien n'est plus valide. Demande un nouveau lien.";
        }
      }
    }

    autoriser.addEventListener("click", () => {
      if (!navigator.geolocation) {
        localisation.innerHTML =
          "<p>La localisation n'est pas disponible sur cet appareil.</p>";
        return;
      }

      navigator.geolocation.getCurrentPosition(
        (position) => {
          console.log(
            "Localisation autorisée :",
            position.coords.latitude,
            position.coords.longitude
          );

          localisation.innerHTML =
            "<p>Merci, ta localisation a été autorisée.</p>";
        },
        () => {
          localisation.innerHTML =
            "<p>La localisation n'a pas été autorisée.</p>";
        }
      );
    });

    refuser.addEventListener("click", () => {
      localisation.innerHTML =
        "<p>La localisation est facultative.</p>";
    });
  </script>

</body>
</html>
