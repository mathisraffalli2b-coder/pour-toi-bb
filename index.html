<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi bébé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fff7f9;
      color: #333;
    }

    .box {
      width: 100%;
      max-width: 500px;
      padding: 30px 22px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #e889a5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }

    #welcome {
      display: none;
    }

    #locationButtons {
      display: flex;
      gap: 10px;
    }

    #locationButtons button {
      flex: 1;
    }

    #protectedImage {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div id="login">

      <h1>Pour toi bébé</h1>

      <p>
        Entre ton adresse mail pour continuer.
      </p>

      <input
        id="email"
        type="email"
        placeholder="Ton adresse e-mail"
        autocomplete="email"
      >

 <button id="sendButton">
  Recevoir le lien
</button>
      <div id="message" class="message"></div>

    </div>


    <div id="welcome">

      <h1>Bienvenue</h1>

      <p>
        Tu peux maintenant choisir de partager ta localisation.

      </p>

      <div id="locationButtons">

        <button id="allowLocation">
          Autoriser
        </button>

        <button id="denyLocation">
          Refuser
        </button>

      </div>

      <div id="locationMessage" class="message"></div>

      <img
        id="protectedImage"
        src=""
        alt=""
      >

    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>


  <script>

    /* =========================
       FIREBASE
    ========================= */

    const firebaseConfig = {
      apiKey: "AIzaSyBdhh9FeXyjqDBH_q0CMP-d4xrILZXH_O8",
      authDomain: "pour-toi-bb.firebaseapp.com",
      projectId: "pour-toi-bb",
      storageBucket: "pour-toi-bb.firebasestorage.app",
      messagingSenderId: "922098615015",
      appId: "1:922098615015:web:f022dce2b3bb971b071842"
    };


    const message = document.getElementById("message");


    /*
      Si Firebase ne se charge pas du tout,
      on affiche immédiatement le problème.
    */

    if (
      typeof firebase === "undefined" ||
      !firebase.apps
    ) {

      message.className = "message error";

      message.textContent =
        "Firebase ne s'est pas chargé. Recharge la page.";

      throw new Error("Firebase SDK non chargé.");

    }


    firebase.initializeApp(firebaseConfig);

    const auth = firebase.auth();


    /* =========================
       URL DU SITE
    ========================= */

    const siteUrl =
      "https://mathisraffalli2b-coder.github.io/pour-toi-bb/";


    const actionCodeSettings = {

      url: siteUrl,

      handleCodeInApp: true

    };


    /* =========================
       ELEMENTS
    ========================= */

    const login =
      document.getElementById("login");

    const welcome =
      document.getElementById("welcome");

    const emailInput =
      document.getElementById("email");

    const sendButton =
      document.getElementById("sendButton");

    const allowLocation =
      document.getElementById("allowLocation");

    const denyLocation =
      document.getElementById("denyLocation");

    const locationMessage =
      document.getElementById("locationMessage");

    const protectedImage =
      document.getElementById("protectedImage");


    /* =========================
       ENVOI DU LIEN
    ========================= */

    sendButton.addEventListener(
      "click",
      function () {

        const email =
          emailInput.value.trim();


        message.className =
          "message";

        message.textContent =
          "";


        if (!email) {

          message.textContent =
            "Entre ton adresse e-mail.";

          return;

        }


        sendButton.disabled = true;

        sendButton.textContent =
          "Envoi en cours...";


        auth.sendSignInLinkToEmail(
          email,
          actionCodeSettings
        )

        .then(function () {

          /*
            Firebase a accepté l'envoi.
          */

          localStorage.setItem(
            "emailForSignIn",
            email
          );


          message.className =
            "message success";

          message.textContent =
            "Le lien a été envoyé. Vérifie ta boîte mail.";

        })

        .catch(function (error) {

          console.error(
            "Firebase:",
            error
          );


          message.className =
            "message error";

          message.textContent =
            "Erreur Firebase : " +
            error.code +
            " — " +
            error.message;

        })

        .finally(function () {

          sendButton.disabled =
            false;

          sendButton.textContent =
            "Recevoir le lien";

        });

      }
    );


    /* =========================
       AFFICHER LA PAGE PRIVÉE
    ========================= */

    function showWelcome() {

      login.style.display =
        "none";

      welcome.style.display =
        "block";

    }


    /* =========================
       TRAITER LE LIEN REÇU
    ========================= */

    if (
      auth.isSignInWithEmailLink(
        window.location.href
      )
    ) {

      let email =
        localStorage.getItem(
          "emailForSignIn"
        );


      if (!email) {

        email =
          window.prompt(
            "Entre l'adresse e-mail utilisée pour recevoir le lien :"
          );

      }


      if (email) {

        auth.signInWithEmailLink(
          email,
          window.location.href
        )

        .then(function () {

          localStorage.removeItem(
            "emailForSignIn"
          );

          showWelcome();

        })

        .catch(function (error) {

          login.style.display =
            "block";

          message.className =
            "message error";

          message.textContent =
            "Impossible de confirmer le lien : " +
            error.code +
            " — " +
            error.message;

        });

      }

    }


    /* =========================
       UTILISATEUR DÉJÀ CONNECTÉ
    ========================= */

    auth.onAuthStateChanged(
      function (user) {

        if (user) {

          showWelcome();

        }

      }
    );


    /* =========================
       AUTORISER LA LOCALISATION
    ========================= */

    allowLocation.addEventListener(
      "click",
      function () {

        locationMessage.className =
          "message";

        locationMessage.textContent =
          "Demande de localisation...";


        if (!navigator.geolocation) {

          locationMessage.textContent =
            "La localisation n'est pas disponible.";

          showImage();

          return;

        }


        navigator.geolocation.getCurrentPosition(

          function (position) {

            /*
              La localisation n'est utilisée
              qu'après l'autorisation du visiteur.
            */

            console.log(
              "Localisation autorisée :",
              position.coords.latitude,
              position.coords.longitude
            );


            locationMessage.textContent =
              "Merci. Ta localisation a été autorisée.";

            showImage();

          },


          function () {

            locationMessage.textContent =
              "La localisation n'a pas été autorisée.";

            showImage();

          }

        );

      }
    );


    /* =========================
       REFUSER LA LOCALISATION
    ========================= */

    denyLocation.addEventListener(
      "click",
      function () {

        locationMessage.className =
          "message";

        locationMessage.textContent =
          "D'accord. La localisation reste facultative.";

        showImage();

      }
    );


    /* =========================
       IMAGE
    ========================= */

    function showImage() {

      /*
        L'image réelle sera ajoutée ici
        lorsque tu me donneras le fichier.

        Pour le moment, rien n'est affiché.
      */

      protectedImage.style.display =
        "none";

    }

  </script>

</body>
</html>
