<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi bébé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fff7f9;
      color: #333;
    }

    .box {
      width: 100%;
      max-width: 500px;
      padding: 30px 22px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0, 0, 0, 0.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #e889a5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
    }

    .message {
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }

    #welcome {
      display: none;
    }

    #locationButtons {
      display: flex;
      gap: 10px;
    }

    #locationButtons button {
      flex: 1;
    }

    #protectedImage {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <!-- PAGE DE CONNEXION -->
    <div id="login">

      <h1>Pour toi bébé</h1>

      <p>Entre ton adresse mail pour continuer.</p>

      <input
        id="email"
        type="email"
        placeholder="Ton adresse e-mail"
        autocomplete="email"
      >

      <button
        id="sendButton"
        type="button"
        onclick="sendLink()"
      >
        Recevoir le lien
      </button>

      <div id="message" class="message"></div>

    </div>


    <!-- PAGE APRÈS CONNEXION -->
    <div id="welcome">

      <h1>Bienvenue ❤️</h1>

      <p>
        Tu peux maintenant choisir de partager ta localisation.
        C'est facultatif.
      </p>

      <div id="locationButtons">

        <button
          type="button"
          onclick="allowLocation()"
        >
          Autoriser
        </button>

        <button
          type="button"
          onclick="denyLocation()"
        >
          Refuser
        </button>

      </div>

      <div id="locationMessage" class="message"></div>

      <img
        id="protectedImage"
        src=""
        alt=""
      >

    </div>

  </div>


  <!-- FIREBASE -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>


  <script>

    const firebaseConfig = {
      apiKey: "AIzaSyBdhh9FeXyjqDBH_q0CMP-d4xrILZXH_O8",
      authDomain: "pour-toi-bb.firebaseapp.com",
      projectId: "pour-toi-bb",
      storageBucket: "pour-toi-bb.firebasestorage.app",
      messagingSenderId: "922098615015",
      appId: "1:922098615015:web:f022dce2b3bb971b071842"
    };


    const SITE_URL =
      "https://mathisraffalli2b-coder.github.io/pour-toi-bb/";


    const message =
      document.getElementById("message");

    const login =
      document.getElementById("login");

    const welcome =
      document.getElementById("welcome");

    const emailInput =
      document.getElementById("email");

    const sendButton =
      document.getElementById("sendButton");


    let auth = null;


    /*
      INITIALISATION FIREBASE
    */

    if (typeof firebase === "undefined") {

      message.className = "message error";

      message.textContent =
        "Firebase ne se charge pas. Recharge la page.";

    } else {

      try {

        firebase.initializeApp(firebaseConfig);

        auth = firebase.auth();

        auth.onAuthStateChanged(function(user) {

          if (user) {
            showWelcome();
          }

        });

        /*
          Si la page actuelle contient un lien Firebase,
          on tente automatiquement de terminer la connexion.
        */

        if (
          auth.isSignInWithEmailLink(
            window.location.href
          )
        ) {

          let email =
            localStorage.getItem("emailForSignIn");

          if (!email) {

            email = window.prompt(
              "Entre l'adresse e-mail utilisée pour recevoir le lien :"
            );

          }

          if (email) {

            auth.signInWithEmailLink(
              email,
              window.location.href
            )
            .then(function() {

              localStorage.removeItem(
                "emailForSignIn"
              );

              showWelcome();

            })
            .catch(function(error) {

              message.className =
                "message error";

              message.textContent =
                "Erreur de connexion : " +
                error.code;

            });

          }

        }

      } catch (error) {

        message.className =
          "message error";

        message.textContent =
          "Erreur Firebase : " +
          error.message;

      }

    }


    /*
      ENVOYER LE LIEN
    */

    function sendLink() {

      const email =
        emailInput.value.trim();


      if (!email) {

        message.className =
          "message error";

        message.textContent =
          "Entre ton adresse e-mail.";

        return;

      }


      if (!auth) {

        message.className =
          "message error";

        message.textContent =
          "Firebase n'est pas chargé.";

        return;

      }


      sendButton.disabled = true;

      sendButton.textContent =
        "Envoi en cours...";

      message.className =
        "message";

      message.textContent =
        "";


      const settings = {

        url: SITE_URL,

        handleCodeInApp: true

      };


      auth.sendSignInLinkToEmail(
        email,
        settings
      )

      .then(function() {

        localStorage.setItem(
          "emailForSignIn",
          email
        );

        message.className =
          "message success";

        message.textContent =
          "Le lien a été envoyé. Vérifie ta boîte mail.";

      })

      .catch(function(error) {

        console.error(error);

        message.className =
          "message error";

        message.textContent =
          "Erreur Firebase : " +
          error.code +
          " — " +
          error.message;

      })

      .finally(function() {

        sendButton.disabled = false;

        sendButton.textContent =
          "Recevoir le lien";

      });

    }


    /*
      AFFICHER LA PAGE BIENVENUE
    */

    function showWelcome() {

      login.style.display =
        "none";

      welcome.style.display =
        "block";

    }


    /*
      AUTORISER LA LOCALISATION
    */

    function allowLocation() {

      const locationMessage =
        document.getElementById(
          "locationMessage"
        );


      locationMessage.textContent =
        "Demande de localisation...";


      if (!navigator.geolocation) {

        locationMessage.textContent =
          "La localisation n'est pas disponible.";

        showImage();

        return;

      }


      navigator.geolocation.getCurrentPosition(

        function(position) {

          console.log(
            position.coords.latitude,
            position.coords.longitude
          );

          locationMessage.textContent =
            "Merci. Ta localisation a été autorisée.";

          showImage();

        },

        function() {

          locationMessage.textContent =
            "La localisation n'a pas été autorisée.";

          showImage();

        }

      );

    }


    /*
      REFUSER LA LOCALISATION
    */

    function denyLocation() {

      const locationMessage =
        document.getElementById(
          "locationMessage"
        );


      locationMessage.textContent =
        "D'accord. La localisation reste facultative.";

      showImage();

    }


    /*
      IMAGE
    */

    function showImage() {

      /*
        L'image sera ajoutée ici ensuite.
      */

      document.getElementById(
        "protectedImage"
      ).style.display = "none";

    }

  </script>

</body>
</html>
