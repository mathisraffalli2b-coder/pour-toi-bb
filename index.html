<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pour toi bébé</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      padding: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-family: Arial, sans-serif;
      background: #fff7f9;
      color: #333;
    }

    .box {
      width: 100%;
      max-width: 500px;
      padding: 30px 22px;
      background: white;
      border-radius: 20px;
      text-align: center;
      box-shadow: 0 5px 25px rgba(0,0,0,0.08);
    }

    h1 {
      margin-top: 0;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 1px solid #ccc;
      border-radius: 10px;
      font-size: 16px;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 15px;
      border: 0;
      border-radius: 10px;
      background: #e889a5;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      margin-top: 15px;
      line-height: 1.5;
      word-break: break-word;
    }

    .error {
      color: #c62828;
    }

    .success {
      color: #2e7d32;
    }

    #welcome {
      display: none;
    }

    #locationButtons {
      display: flex;
      gap: 10px;
    }

    #locationButtons button {
      flex: 1;
    }

    #protectedImage {
      display: none;
      width: 100%;
      margin-top: 20px;
      border-radius: 15px;
    }
  </style>
</head>

<body>

  <div class="box">

    <div id="login">
      <h1>Pour toi bébé</h1>

      <p>Entre ton adresse mail pour continuer.</p>

      <input
        id="email"
        type="email"
        placeholder="Ton adresse e-mail"
        autocomplete="email"
      >

      <button id="sendButton" type="button">
        Recevoir le lien
      </button>

      <div id="message" class="message"></div>
    </div>


    <div id="welcome">
      <h1>Bienvenue ❤️</h1>

      <p>
        Tu peux maintenant choisir de partager ta localisation.
        C'est facultatif.
      </p>

      <div id="locationButtons">
        <button id="allowLocation" type="button">
          Autoriser
        </button>

        <button id="denyLocation" type="button">
          Refuser
        </button>
      </div>

      <div id="locationMessage" class="message"></div>

      <img
        id="protectedImage"
        src=""
        alt=""
      >
    </div>

  </div>


  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/12.19.0/firebase-auth-compat.js"></script>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyBdhh9FeXyjqDBH_q0CMP-d4xrILZXH_O8",
      authDomain: "pour-toi-bb.firebaseapp.com",
      projectId: "pour-toi-bb",
      storageBucket: "pour-toi-bb.firebasestorage.app",
      messagingSenderId: "922098615015",
      appId: "1:922098615015:web:f022dce2b3bb971b071842"
    };

    const siteUrl =
      "https://mathisraffalli2b-coder.github.io/pour-toi-bb/";

    const message = document.getElementById("message");
    const login = document.getElementById("login");
    const welcome = document.getElementById("welcome");
    const emailInput = document.getElementById("email");
    const sendButton = document.getElementById("sendButton");
    const allowLocation = document.getElementById("allowLocation");
    const denyLocation = document.getElementById("denyLocation");
    const locationMessage =
      document.getElementById("locationMessage");
    const protectedImage =
      document.getElementById("protectedImage");

    function showError(text) {
      message.className = "message error";
      message.textContent = text;
    }

    function showSuccess(text) {
      message.className = "message success";
      message.textContent = text;
    }

    function showWelcome() {
      login.style.display = "none";
      welcome.style.display = "block";
    }

    function showImage() {
      /*
        L'image sera ajoutée ici lorsque son fichier sera disponible.
        Elle reste totalement cachée tant qu'aucune image n'est fournie.
      */

      protectedImage.style.display = "none";
    }


    /*
      Vérification du chargement Firebase.
    */

    if (typeof firebase === "undefined") {

      showError(
        "Firebase ne s'est pas chargé. Recharge la page."
      );

    } else {

      try {

        firebase.initializeApp(firebaseConfig);

        const auth = firebase.auth();

        const actionCodeSettings = {
          url: siteUrl,
          handleCodeInApp: true
        };


        /*
          ENVOI DU LIEN PAR E-MAIL
        */

        sendButton.addEventListener("click", function () {

          const email = emailInput.value.trim();

          message.className = "message";
          message.textContent = "";

          if (!email) {
            showError("Entre ton adresse e-mail.");
            return;
          }

          sendButton.disabled = true;
          sendButton.textContent = "Envoi en cours...";

          auth.sendSignInLinkToEmail(
            email,
            actionCodeSettings
          )
          .then(function () {

            localStorage.setItem(
              "emailForSignIn",
              email
            );

            showSuccess(
              "Le lien a été envoyé. Vérifie ta boîte mail."
            );

          })
          .catch(function (error) {

            console.error("Firebase:", error);

            showError(
              "Erreur Firebase : " +
              (error.code || "inconnue") +
              " — " +
              (error.message || "Erreur inconnue")
            );

          })
          .finally(function () {

            sendButton.disabled = false;
            sendButton.textContent = "Recevoir le lien";

          });

        });


        /*
          TRAITEMENT DU LIEN REÇU PAR E-MAIL
        */

        if (
          auth.isSignInWithEmailLink(
            window.location.href
          )
        ) {

          let email =
            localStorage.getItem("emailForSignIn");

          if (!email) {

            email = window.prompt(
              "Entre l'adresse e-mail utilisée pour recevoir le lien :"
            );

          }

          if (email) {

            auth.signInWithEmailLink(
              email,
              window.location.href
            )
            .then(function () {

              localStorage.removeItem(
                "emailForSignIn"
              );

              showWelcome();

            })
            .catch(function (error) {

              showError(
                "Impossible de confirmer le lien : " +
                (error.code || "inconnue") +
                " — " +
                (error.message || "Erreur inconnue")
              );

            });

          }

        }


        /*
          UTILISATEUR DÉJÀ CONNECTÉ
        */

        auth.onAuthStateChanged(function (user) {

          if (user) {
            showWelcome();
          }

        });


        /*
          AUTORISER LA LOCALISATION
        */

        allowLocation.addEventListener(
          "click",
          function () {

            locationMessage.className = "message";
            locationMessage.textContent =
              "Demande de localisation...";

            if (!navigator.geolocation) {

              locationMessage.textContent =
                "La localisation n'est pas disponible.";

              showImage();
              return;

            }

            navigator.geolocation.getCurrentPosition(

              function (position) {

                console.log(
                  "Localisation autorisée :",
                  position.coords.latitude,
                  position.coords.longitude
                );

                locationMessage.textContent =
                  "Merci. Ta localisation a été autorisée.";

                showImage();

              },

              function () {

                locationMessage.textContent =
                  "La localisation n'a pas été autorisée.";

                showImage();

              }

            );

          }
        );


        /*
          REFUSER LA LOCALISATION
        */

        denyLocation.addEventListener(
          "click",
          function () {

            locationMessage.className = "message";

            locationMessage.textContent =
              "D'accord. La localisation reste facultative.";

            showImage();

          }
        );


      } catch (error) {

        console.error("Erreur d'initialisation :", error);

        showError(
          "Erreur d'initialisation Firebase : " +
          (error.message || "Erreur inconnue")
        );

      }

    }
  </script>

</body>
</html>
